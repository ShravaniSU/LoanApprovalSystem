name: Azure ML CD Pipeline

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Name of the registered model to deploy"
        required: true
        default: "loan_prediction_model"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml

      - name: Update Managed Online Deployment
        run: |
          # Example command to deploy or update your endpoint using Azure CLI
          az ml online-deployment update \
            --name blue \
            --endpoint-name loan-prediction-endpoint \
            --model ${{ inputs.model_name }}:1 \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AZURE_ML_WORKSPACE }}